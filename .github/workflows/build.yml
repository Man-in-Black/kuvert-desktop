# Baut Kuvert Desktop für Linux, Windows und macOS.
#   Push auf main / Pull Request / manuell: Pakete als Workflow-Artefakte
#   Tag vX.Y.Z: zusätzlich GitHub-Release „Kuvert Desktop X.Y.Z" (Latest) mit allen Paketen
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, target: linux }
          - { name: Windows, os: windows-latest, target: win }
          - { name: macOS, os: macos-latest, target: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund

      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Pakete bauen
        run: npm run dist:${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: kuvert-desktop-${{ matrix.target }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Kuvert Desktop ${GITHUB_REF_NAME#v}"
          --generate-notes --latest
